<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Front Enjoy — уроки и мини-квизы по фронтенду. Трек React на русском."
    />
    <title>Front Enjoy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Source+Serif+4:opsz,wght@8..60,560;8..60,650;8..60,720&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        const theme = JSON.parse(localStorage.getItem("fe-theme") || '"light"');
        if (theme === "dark") document.documentElement.classList.add("dark");
      } catch {
        /* keep light */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
